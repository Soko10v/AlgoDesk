[project]
name = "algodesk-backend"
version = "0.1.0"
description = "AlgoDesk backend service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "ccxt>=4.4.0",
  "certifi>=2024.8.30",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "greenlet>=3.0.3",
  "httpx>=0.27.0",
  "numpy>=2.1.0",
  "pandas>=2.2.2",
  "psycopg2-binary>=2.9.9",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "redis>=5.0.8",
  "sentry-sdk[fastapi]>=2.0.0",
  "slowapi>=0.1.9",
  "sqlalchemy>=2.0.34",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.2",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
