# Production VPS: Supabase Postgres (DATABASE_URL in .env) + Redis + backend + frontend.
# Optional local Postgres: docker compose --profile local-db up
services:
  postgres:
    profiles: ["local-db"]
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: algodesk
      POSTGRES_PASSWORD: algodesk
      POSTGRES_DB: algodesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algodesk -d algodesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bots and the live price stream run inside this single backend process and
  # are recovered on startup. Run a single backend replica (state is in-process).
  # Durable data lives in Supabase; Redis holds ephemeral prices and WS events.
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE: /api/v1
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
