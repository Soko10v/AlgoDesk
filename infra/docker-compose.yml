services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: algodesk
      POSTGRES_PASSWORD: algodesk
      POSTGRES_DB: algodesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algodesk -d algodesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bots and the live price stream run inside this single backend process and
  # are recovered on startup. Run a single backend replica (state is in-process).
  # Not published externally — nginx (frontend) proxies /api to it.
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://algodesk:algodesk@postgres:5432/algodesk
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # nginx serves the built SPA and reverse-proxies /api (+ WebSocket) to backend.
  # The only externally published port.
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE: /api/v1
    restart: unless-stopped
    # Bound to loopback; the host nginx terminates TLS and proxies to this.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
