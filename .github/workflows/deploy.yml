name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DS_KEY }}
          LAVA_API_KEY: ${{ secrets.LAVA_KEY }}
          LAVA_WEBHOOK_PASSWORD: ${{ secrets.LAVA_WH_PWD }}
          LAVA_OFFER_PRO: ${{ secrets.LAVA_OFFER_PRO }}
          LAVA_OFFER_EXPERT: ${{ secrets.LAVA_OFFER_EXPERT }}
          CRYPTOMUS_MERCHANT: ${{ secrets.CRYPTOMUS_MERCHANT }}
          CRYPTOMUS_API_KEY: ${{ secrets.CRYPTOMUS_API_KEY }}
          PLISIO_API_KEY: ${{ secrets.PLISIO_KEY }}
          FREE_MODE: ${{ secrets.FREE_MODE }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEEPSEEK_API_KEY,LAVA_API_KEY,LAVA_WEBHOOK_PASSWORD,LAVA_OFFER_PRO,LAVA_OFFER_EXPERT,CRYPTOMUS_MERCHANT,CRYPTOMUS_API_KEY,PLISIO_API_KEY,FREE_MODE,ADMIN_EMAILS
          script: |
            set -e
            cd /root/AlgoDesk
            git fetch origin main
            git reset --hard origin/main
            cd infra
            # Sync secrets from GitHub into .env (untracked) so the backend can read
            # them. Written to the file only, never echoed. Empty values are skipped.
            touch .env
            sync_env() {
              key="$1"; val="$2"
              [ -n "$val" ] || return 0
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              echo "${key}=${val}" >> .env.tmp
              mv .env.tmp .env
              echo "[deploy] ${key} synced into infra/.env"
            }
            sync_env DEEPSEEK_API_KEY "$DEEPSEEK_API_KEY"
            sync_env LAVA_API_KEY "$LAVA_API_KEY"
            sync_env LAVA_WEBHOOK_PASSWORD "$LAVA_WEBHOOK_PASSWORD"
            sync_env LAVA_WEBHOOK_LOGIN "algodesk"
            sync_env LAVA_OFFER_PRO "$LAVA_OFFER_PRO"
            sync_env LAVA_OFFER_EXPERT "$LAVA_OFFER_EXPERT"
            sync_env CRYPTOMUS_MERCHANT "$CRYPTOMUS_MERCHANT"
            sync_env CRYPTOMUS_API_KEY "$CRYPTOMUS_API_KEY"
            sync_env PLISIO_API_KEY "$PLISIO_API_KEY"
            sync_env FREE_MODE "$FREE_MODE"
            sync_env ADMIN_EMAILS "$ADMIN_EMAILS"
            docker compose build
            # Apply migrations explicitly via a one-off container so they ALWAYS
            # run (regardless of RUN_DB_MIGRATIONS in the VPS .env) and fail the
            # deploy loudly if a migration errors — the entrypoint's migration
            # output is otherwise hidden inside container logs.
            echo "[deploy] Applying database migrations..."
            docker compose run --rm -T backend alembic upgrade head
            docker compose up -d --remove-orphans
            docker compose ps
