name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DS_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEEPSEEK_API_KEY
          script: |
            set -e
            cd /root/AlgoDesk
            git fetch origin main
            git reset --hard origin/main
            cd infra
            # Sync the DeepSeek key from the GitHub secret into .env (untracked) so
            # the backend can read it. Written to the file only, never logged.
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              touch .env
              grep -v '^DEEPSEEK_API_KEY=' .env > .env.tmp 2>/dev/null || true
              echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" >> .env.tmp
              mv .env.tmp .env
              echo "[deploy] DEEPSEEK_API_KEY synced into infra/.env"
            fi
            docker compose build
            # Apply migrations explicitly via a one-off container so they ALWAYS
            # run (regardless of RUN_DB_MIGRATIONS in the VPS .env) and fail the
            # deploy loudly if a migration errors — the entrypoint's migration
            # output is otherwise hidden inside container logs.
            echo "[deploy] Applying database migrations..."
            docker compose run --rm -T backend alembic upgrade head
            docker compose up -d --remove-orphans
            docker compose ps
